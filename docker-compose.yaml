networks:
  symfony_net:
    driver: bridge

volumes:
  db_data:
  es_data:

services:
  symfony:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: symfony_frankenphp_app
    restart: unless-stopped
    ports:
      - '8080:80'
      - '8443:443'
      - '8443:443/udp'
    volumes:
      - ./backend:/app
    networks:
      - symfony_net
    depends_on:
      - db
      - es
    deploy:
      resources:
        limits:
          memory: 1.5G
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://127.0.0.1']
      interval: 10s
      timeout: 5s
      retries: 5

  db:
    image: postgres:16-alpine
    container_name: symfony_postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: symfony_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - symfony_net
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 5

  es:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0 # Use a specific, recent 8.x version
    container_name: symfony_elasticsearch
    restart: unless-stopped
    environment:
      # Required settings for single-node development
      - node.name=es
      - cluster.name=symfony-cluster
      - discovery.type=single-node
      # Set basic security for development (user: elastic, pass: changeme)
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=changeme
      - http.host=0.0.0.0
      - transport.host=0.0.0.0
      # Allow memory locking
      - bootstrap.memory_lock=true
      # Set JVM heap size for development (adjust in production)
      - 'ES_JAVA_OPTS=-Xms1536m -Xmx1536m'
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - symfony_net
    deploy:
      resources:
        limits:
          memory: 3G
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://elastic:changeme@localhost:9200/_cat/health | grep -q green"]
      interval: 10s
      timeout: 5s
      retries: 5
  mailer:
    image: axllent/mailpit
    container_name: symfony_mailer
    ports:
      - "1025"
      - "8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1